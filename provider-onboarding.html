<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Onboarding · Alpaca Health</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Alpaca brand palette */
      --bg: #f4f0fa;
      --bg-elev: #ffffff;
      --bg-secondary: #ece6f7;
      --bg-tertiary: #ddd2ee;

      --bg-success: #e8f0e4;
      --bg-info: #e6e0f5;
      --bg-warning: #faecd9;

      --ink: #0e0a26;
      --ink-secondary: #2e2842;
      --ink-tertiary: #6b6580;
      --ink-quaternary: #a8a3b8;

      --accent: #7c3aed;
      --accent-deep: #6d28d9;
      --accent-soft: #a78bfa;
      --success: #3d6332;
      --info: #4c1d95;
      --warning: #8a5a1a;

      --border: #e0d8ee;
      --border-strong: #c8bbe0;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-pill: 999px;

      --serif: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body { min-height: 100vh; }

    .app {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--ink);
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-family: var(--serif);
      font-size: 17px; font-weight: 500;
      letter-spacing: -0.02em;
    }
    .brand-name {
      font-weight: 600; font-size: 18px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .brand-divider {
      width: 1px; height: 18px;
      background: var(--border-strong);
      margin: 0 4px;
    }
    .brand-context {
      font-size: 13px;
      color: var(--ink-tertiary);
      font-weight: 500;
    }
    .topbar-actions { display: flex; gap: 8px; }

    button {
      font-family: var(--sans);
      font-size: 14px; font-weight: 500;
      padding: 9px 16px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background: var(--bg-elev);
      color: var(--ink);
      cursor: pointer;
      transition: all 140ms ease;
    }
    button:hover:not(:disabled) { border-color: var(--ink); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      padding: 10px 20px;
    }
    button.primary:hover:not(:disabled) {
      background: var(--accent-deep);
      border-color: var(--accent-deep);
    }
    button.primary:disabled {
      background: var(--accent-soft);
      border-color: var(--accent-soft);
      color: white;
      opacity: 1;
    }
    button.text-only {
      background: transparent; border: none;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--ink-tertiary);
      border-radius: var(--radius-md);
    }
    button.text-only:hover {
      color: var(--ink);
      background: var(--bg-secondary);
    }

    select, input[type="text"], textarea {
      font-family: var(--sans);
      font-size: 14px;
      padding: 10px 14px;
      width: 100%;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--bg-elev);
      color: var(--ink);
      transition: all 140ms ease;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }
    textarea { resize: vertical; min-height: 80px; }
    input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

    .progress-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .progress-counter {
      font-size: 12px;
      color: var(--ink-tertiary);
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .progress-bar {
      height: 4px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-pill);
      overflow: hidden;
      margin-bottom: 32px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill);
      transition: width 280ms cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    .card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 1px 3px rgba(14, 10, 38, 0.04), 0 4px 24px rgba(14, 10, 38, 0.05);
    }

    .step-head {
      display: flex; align-items: baseline; gap: 10px;
      flex-wrap: wrap; margin-bottom: 8px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 36px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--ink);
      font-variation-settings: "opsz" 96;
    }
    .step-time {
      font-size: 13px;
      color: var(--ink-tertiary);
      margin: 0 0 28px;
      font-weight: 500;
    }

    .badge {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.01em;
    }
    .badge-info { background: var(--bg-info); color: var(--info); }
    .badge-success { background: var(--bg-success); color: var(--success); }
    .badge-warning { background: var(--bg-warning); color: var(--warning); }
    .badge-done { background: var(--bg-tertiary); color: var(--ink-secondary); }

    .why-block {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      margin-bottom: 28px;
      border-left: 3px solid var(--accent);
    }
    .label-sm {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink-tertiary);
      margin: 0 0 8px;
    }
    .why-text {
      font-size: 15px; line-height: 1.6;
      margin: 0; color: var(--ink);
    }

    ol.actions { margin: 0; padding-left: 24px; }
    ol.actions li {
      font-size: 15px; line-height: 1.7;
      margin-bottom: 10px; color: var(--ink);
    }
    ol.actions li::marker {
      color: var(--ink-quaternary);
      font-weight: 500; font-size: 13px;
    }

    .links { margin-top: 22px; }
    .links-list { display: flex; flex-direction: column; gap: 8px; }
    .link-item {
      font-size: 14px;
      color: var(--ink);
      text-decoration: none;
      padding: 11px 16px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      transition: all 140ms ease;
      display: flex; align-items: center; gap: 10px;
      font-weight: 500;
    }
    .link-item:hover {
      border-color: var(--accent-soft);
      background: var(--bg-elev);
      color: var(--accent-deep);
    }
    .link-arrow { color: var(--accent); font-weight: 600; }

    .sample-msg {
      margin-top: 22px; padding: 18px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    .sample-msg-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
    }
    .sample-msg-meta {
      font-size: 12px;
      color: var(--ink-tertiary);
      margin-bottom: 12px;
      line-height: 1.7;
    }
    .sample-msg-meta strong {
      color: var(--ink-secondary);
      font-weight: 600;
    }
    .sample-msg-body {
      font-family: var(--mono);
      font-size: 12.5px; line-height: 1.7;
      white-space: pre-wrap; word-wrap: break-word;
      margin: 0; padding: 14px 16px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--ink);
    }

    .input-section {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }
    .input-field { margin-bottom: 18px; }
    .input-field label.field-label {
      display: block;
      font-size: 13px;
      color: var(--ink-secondary);
      margin-bottom: 7px;
      font-weight: 600;
    }
    .checkbox-field {
      display: flex; align-items: flex-start; gap: 10px;
      cursor: pointer; font-size: 14px; line-height: 1.5;
    }
    .checkbox-field input { margin-top: 3px; flex-shrink: 0; }
    .multiselect { display: flex; flex-direction: column; gap: 8px; }
    .field-note {
      font-size: 12.5px;
      color: var(--ink-tertiary);
      margin: 7px 0 0;
      line-height: 1.5;
    }

    .review-section {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }
    .review-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      margin-top: 8px;
      table-layout: fixed;
      overflow: hidden;
    }
    .review-table td {
      padding: 11px 16px;
      vertical-align: top;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      word-wrap: break-word;
    }
    .review-table tr:last-child td { border-bottom: none; }
    .review-table .key {
      width: 45%;
      color: var(--ink-tertiary);
      font-size: 12.5px;
      font-weight: 500;
    }
    .review-table .val { color: var(--ink); }
    .review-table .empty {
      color: var(--ink-quaternary);
      font-style: italic;
    }
    .export-actions {
      display: flex; gap: 8px; align-items: center;
      flex-wrap: wrap; margin-top: 14px;
    }
    .copy-feedback {
      font-size: 12.5px;
      color: var(--success);
      font-weight: 500;
    }
    .review-note {
      font-size: 12.5px;
      color: var(--ink-tertiary);
      margin: 14px 0 0;
      line-height: 1.6;
    }

    .handoff {
      margin-top: 28px; padding: 18px;
      background: var(--bg-success);
      border-radius: var(--radius-md);
      border-left: 3px solid var(--success);
    }
    .handoff p { margin: 0; font-size: 14.5px; line-height: 1.6; }
    .handoff-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--success);
      margin-bottom: 6px;
    }

    .step-foot {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
    }
    .done-toggle {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; cursor: pointer; font-weight: 500;
    }
    .support-link {
      font-size: 12px;
      color: var(--ink-tertiary);
      text-decoration: none;
    }
    .support-link:hover { color: var(--accent-deep); }

    .step-dots {
      display: flex; gap: 5px;
      margin-top: 18px; flex-wrap: wrap;
    }
    .step-dot {
      flex: 1; min-width: 16px; height: 6px;
      padding: 0;
      background: var(--bg-tertiary);
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 140ms ease;
    }
    .step-dot:hover { background: var(--accent-soft); }
    .step-dot.current { background: var(--ink-secondary); }
    .step-dot.complete { background: var(--accent); }

    .footer-bar {
      display: flex; gap: 10px;
      margin-top: 28px; align-items: center;
    }
    .phase-label {
      margin-left: auto;
      font-size: 12px;
      color: var(--ink-tertiary);
      font-weight: 500;
    }

    /* Cover */
    .cover { padding: 52px 40px; }
    .cover-eyebrow {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 18px;
    }
    .cover-title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 56px;
      line-height: 1.05;
      letter-spacing: -0.025em;
      margin: 0 0 20px;
      color: var(--ink);
      font-variation-settings: "opsz" 144;
    }
    .cover-title em {
      font-style: italic;
      color: var(--accent);
      font-weight: 400;
    }
    .cover-deck {
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink-secondary);
      margin: 0 0 36px;
      max-width: 580px;
    }
    .cover-callout {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 28px;
      border-left: 3px solid var(--accent);
    }
    .cover-callout-title {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink-secondary);
      margin: 0 0 8px;
    }
    .cover-callout p {
      font-size: 15px; line-height: 1.6;
      margin: 0; color: var(--ink);
    }
    .cover-callout a {
      color: var(--accent-deep);
      text-decoration: none;
      font-weight: 600;
    }
    .cover-callout a:hover { text-decoration: underline; }

    .cover-section-label {
      font-family: var(--serif);
      font-size: 26px; font-weight: 400;
      color: var(--ink);
      margin: 0 0 18px;
      letter-spacing: -0.015em;
    }
    .cover-section-label em {
      font-style: italic;
      color: var(--accent);
    }

    .cover-list {
      list-style: none; padding: 0;
      margin: 0 0 36px;
      counter-reset: cover-counter;
    }
    .cover-list li {
      counter-increment: cover-counter;
      display: flex; gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px; line-height: 1.5;
    }
    .cover-list li:last-child { border-bottom: none; }
    .cover-list li::before {
      content: counter(cover-counter, decimal-leading-zero);
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
      flex-shrink: 0;
      min-width: 30px;
      padding-top: 2px;
      letter-spacing: 0.02em;
    }
    .cover-list-title { font-weight: 600; color: var(--ink); }
    .cover-list-desc { color: var(--ink-tertiary); font-size: 14px; }

    .cover-cta {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 16px; font-weight: 500;
      padding: 14px 28px;
      border-radius: var(--radius-pill);
      background: var(--accent);
      color: white;
      border: 1px solid var(--accent);
      cursor: pointer;
      transition: all 140ms ease;
      font-family: var(--sans);
    }
    .cover-cta:hover {
      background: var(--accent-deep);
      border-color: var(--accent-deep);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.3);
    }
    .cover-cta-arrow { transition: transform 140ms ease; }
    .cover-cta:hover .cover-cta-arrow { transform: translateX(3px); }

    .state-select-card h1 { font-size: 32px; margin-bottom: 10px; }
    .state-select-intro {
      font-size: 15px; line-height: 1.6;
      color: var(--ink-secondary);
      margin: 0 0 22px;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 600px) {
      .app { padding: 20px 16px 48px; }
      .card { padding: 24px 20px; }
      .cover { padding: 32px 24px; }
      .cover-title { font-size: 38px; }
      .cover-deck { font-size: 16px; }
      h1 { font-size: 28px; }
      .topbar { flex-wrap: wrap; gap: 12px; }
      .brand-context { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <span class="brand-name">Alpaca Health</span>
        <span class="brand-divider"></span>
        <span class="brand-context">Provider Onboarding</span>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>

    <div id="header-area" style="display: none;">
      <div class="progress-row">
        <p class="progress-counter" id="step-counter">Step 1 of 11</p>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
      </div>
    </div>

    <div id="step-container"></div>

    <div id="footer-area" class="footer-bar" style="display: none;">
      <button id="back-btn">← Back</button>
      <button id="next-btn" class="primary">Mark complete & continue →</button>
      <span class="phase-label" id="phase-label"></span>
    </div>
  </div>

<script>
const storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) return null;
    return { key, value: v };
  },
  async set(key, value) { localStorage.setItem(key, value); return { key, value }; },
  async delete(key) { localStorage.removeItem(key); return { key, deleted: true }; }
};

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function renderTopbarActions() {

async function loadAll() {
  try {
    const seenCover = await storage.get('alpaca:seenCover');
    const stateRec = await storage.get('alpaca:state');
    if (seenCover && seenCover.value === "true" && stateRec && stateRec.value) {
      const found = STATES.find(s => s.code === stateRec.value);
      if (found) { selectedState = found; stage = "steps"; }
    } else if (seenCover && seenCover.value === "true") {
      stage = "stateSelect";
    }
  } catch (e) {}

  try {
    const fd = await storage.get('alpaca:formdata');
    if (fd && fd.value) formData = { ...formData, ...JSON.parse(fd.value) };
  } catch (e) {}

  if (stage === "steps" && selectedState) {
    STEPS = buildSteps(selectedState);
    TOTAL = STEPS.length;
    try {
      const cur = await storage.get('alpaca:currentStep');
      if (cur && cur.value !== undefined) currentStep = parseInt(cur.value, 10) || 0;
    } catch (e) {}
    try {
      const comp = await storage.get('alpaca:completed');
      if (comp && comp.value) completed = JSON.parse(comp.value);
      if (!Array.isArray(completed) || completed.length !== TOTAL) completed = new Array(TOTAL).fill(false);
    } catch (e) { completed = new Array(TOTAL).fill(false); }
    if (currentStep >= TOTAL) currentStep = TOTAL - 1;
    renderStep();
  } else if (stage === "stateSelect") {
    renderStateSelect();
  } else {
    renderCover();
  }
  renderTopbarActions();
}

async function persist() {
  await storage.set('alpaca:currentStep', String(currentStep));
  await storage.set('alpaca:completed', JSON.stringify(completed));
  await storage.set('alpaca:formdata', JSON.stringify(formData));
}

    </div>
  `;

  document.getElementById('cover-start').addEventListener('click', async () => {
    await storage.set('alpaca:seenCover', "true");
    stage = "stateSelect";
    renderStateSelect();
  });
}

function renderStateSelect() {
  headerArea.style.display = 'none';
  footerArea.style.display = 'none';
  renderTopbarActions();

  stepContainer.innerHTML = `
    <div class="card state-select-card">
      <h1>Where will your practice operate?</h1>
      <p class="state-select-intro">Some steps change based on your state — worker's comp rules, your Secretary of State link, and Medicaid authorization mechanics. Picking your state now means you'll only see the work that applies to you.</p>
      <select id="state-select" style="margin-bottom: 18px;">
        <option value="">Select your state…</option>
        ${STATES.map(s => `<option value="${s.code}">${escapeHtml(s.name)}</option>`).join('')}
      </select>
      <div style="display: flex; gap: 10px;">
        <button id="state-back">← Back to overview</button>
        <button id="state-confirm" class="primary" disabled>Start my onboarding →</button>
      </div>
    </div>
  `;

  const sel = document.getElementById('state-select');
  const btn = document.getElementById('state-confirm');
  sel.addEventListener('change', () => { btn.disabled = !sel.value; });
  document.getElementById('state-back').addEventListener('click', () => {
    stage = "cover";
    renderCover();
  });
  btn.addEventListener('click', async () => {
    if (!sel.value) return;
    selectedState = STATES.find(s => s.code === sel.value);
    STEPS = buildSteps(selectedState);
    TOTAL = STEPS.length;
    currentStep = 0;
    completed = new Array(TOTAL).fill(false);
    await storage.set('alpaca:state', selectedState.code);
    await persist();
    stage = "steps";
    renderStep();
    renderTopbarActions();
  });
}

function buildExportText() {
  const s = selectedState;
  const lines = [];
  lines.push("ALPACA PRACTICE ONBOARDING FORM — FIELD EXPORT");
  lines.push("=".repeat(55));
  lines.push("");
  lines.push("Paste each value into the matching field on the Practice Onboarding Form:");
  lines.push("https://airtable.com/appXraplzuYoNoWkq/pagHGQgeRddW2Joce/form");
  lines.push("");
  lines.push("---");
  lines.push("");
  const rows = [
    ["Practice Name", formData.practiceName],
    ["Select your name from the list", formData.ownerName],
    ["Do you want Alpaca to refer you clients?", formData.wantsReferrals],
    ["State", s ? s.name : ""],
    ["What languages do you feel comfortable delivering services in?", formData.languages],
    ["EIN", formData.ein],
    ["W-9", formData.hasW9 ? "Ready to upload (saved as PDF)" : "Not yet ready — see Step 2"],
    ["IRS Form CP575", formData.hasCP575 ? "Ready to upload (saved as PDF)" : "Not yet ready — see Step 2"],
    ["Bank Routing Number", formData.bankRouting],
    ["Bank Account Number", formData.bankAccount],
    ["Bank Name", formData.bankName],
    ["Business Email", formData.businessEmail || "(blank — using Alpaca-provided email)"],
    ["Ages Serviced", (formData.agesServiced && formData.agesServiced.length) ? formData.agesServiced.join(", ") : ""],
    ["Share any details about which clients you prefer to work with", formData.clientPreferences],
    ["Availability", formData.availability]
  ];
  rows.forEach(([k, v]) => {
    lines.push(k + ":");
    lines.push(v || "(not yet provided)");
    lines.push("");
  });
  lines.push("---");
  lines.push("");
  lines.push("FILE UPLOADS REQUIRED ON THE PRACTICE ONBOARDING FORM:");
  lines.push("- W-9 (PDF you completed using the IRS template)");
  lines.push("- IRS Form CP575 (the EIN confirmation letter the IRS sent you)");
  return lines.join("\n");
}

function buildExportHtml() {
  const fields = [
    ["Practice Name", formData.practiceName],
    ["Select your name from the list", formData.ownerName],
    ["Do you want Alpaca to refer you clients?", formData.wantsReferrals],
    ["State", selectedState ? selectedState.name : ""],
    ["What languages do you feel comfortable delivering services in?", formData.languages],
    ["EIN", formData.ein],
    ["W-9", formData.hasW9 ? "Ready to upload" : "Not yet ready"],
    ["IRS Form CP575", formData.hasCP575 ? "Ready to upload" : "Not yet ready"],
    ["Bank Routing Number", formData.bankRouting],
    ["Bank Account Number", formData.bankAccount],
    ["Bank Name", formData.bankName],
    ["Business Email", formData.businessEmail || "(blank — using Alpaca-provided email)"],
    ["Ages Serviced", (formData.agesServiced && formData.agesServiced.length) ? formData.agesServiced.join(", ") : ""],
    ["Client preferences (optional)", formData.clientPreferences],
    ["Availability", formData.availability]
  ];

  const rows = fields.map(([k, v]) => {
    const display = v ? escapeHtml(v) : `<span class="empty">not yet provided</span>`;
    return `<tr><td class="key">${escapeHtml(k)}</td><td class="val">${display}</td></tr>`;
  }).join("");

  return `
    <table class="review-table">${rows}</table>
    <div class="export-actions">
      <button id="copy-export" class="primary">Copy to clipboard</button>
      <button id="download-export">Download as .txt</button>
      <span class="copy-feedback" id="copy-feedback"></span>
    </div>
    <p class="review-note">Note: the W-9 and CP575 are file uploads on the Practice Onboarding Form. You'll need to attach those PDFs directly when you reach the form — they can't be exported as text.</p>
  `;
}

function buildSampleMessageHtml() {
  return `
    <div class="sample-msg">
      <div class="sample-msg-head">
        <p class="label-sm" style="margin: 0;">Sample message to Tony — fill in the bracketed parts</p>
        <button id="copy-tony-message">Copy message</button>
      </div>
      <div class="sample-msg-meta">
        <strong>To:</strong> ${escapeHtml(TONY_EMAIL)}<br/>
        <strong>Subject:</strong> ${escapeHtml(TONY_SUBJECT)}
      </div>
      <pre class="sample-msg-body">${escapeHtml(TONY_BODY)}</pre>
      <span class="copy-feedback" id="tony-copy-feedback" style="margin-top: 10px; display: inline-block;"></span>
    </div>
  `;
}

function bindExportButtons() {
  const copyBtn = document.getElementById('copy-export');
  const dlBtn = document.getElementById('download-export');
  const feedback = document.getElementById('copy-feedback');
  if (!copyBtn || !dlBtn) return;

  copyBtn.addEventListener('click', async () => {
    const text = buildExportText();
    try {
      await navigator.clipboard.writeText(text);
      feedback.textContent = "Copied ✓";
      setTimeout(() => { feedback.textContent = ""; }, 2500);
    } catch (e) {
      feedback.textContent = "Couldn't access clipboard — use Download instead.";
      feedback.style.color = "var(--warning)";
    }
  });

  dlBtn.addEventListener('click', () => {
    const text = buildExportText();
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'alpaca-onboarding-export.txt';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    feedback.textContent = "Downloaded ✓";
    setTimeout(() => { feedback.textContent = ""; }, 2500);
  });
}

function bindSampleMessageButton() {
  const btn = document.getElementById('copy-tony-message');
  const feedback = document.getElementById('tony-copy-feedback');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(TONY_BODY);
      feedback.textContent = "Copied ✓";
      setTimeout(() => { feedback.textContent = ""; }, 2500);
    } catch (e) {
      feedback.textContent = "Couldn't access clipboard — please select and copy manually.";
      feedback.style.color = "var(--warning)";
    }
  });
}

function renderInputField(field) {
  const v = formData[field.key];
  const note = field.note ? `<p class="field-note">${escapeHtml(field.note)}</p>` : "";

  if (field.type === "checkbox") {
    return `<div class="input-field">
      <label class="checkbox-field">
        <input type="checkbox" data-field="${field.key}" ${v ? "checked" : ""} />
        <span>${escapeHtml(field.label)}</span>
      </label>${note}</div>`;
  }
  if (field.type === "select") {
    return `<div class="input-field">
      <label class="field-label">${escapeHtml(field.label)}</label>
      <select data-field="${field.key}">
        <option value="">Select…</option>
        ${field.options.map(o => `<option value="${escapeHtml(o)}" ${v === o ? "selected" : ""}>${escapeHtml(o)}</option>`).join("")}
      </select>${note}</div>`;
  }
  if (field.type === "multiselect") {
    const selected = Array.isArray(v) ? v : [];
    return `<div class="input-field">
      <label class="field-label">${escapeHtml(field.label)}</label>
      <div class="multiselect">
        ${field.options.map(o => `
          <label class="checkbox-field">
            <input type="checkbox" data-multi="${field.key}" value="${escapeHtml(o)}" ${selected.includes(o) ? "checked" : ""} />
            <span>${escapeHtml(o)}</span>
          </label>
        `).join("")}
      </div>${note}</div>`;
  }
  if (field.type === "textarea") {
    return `<div class="input-field">
      <label class="field-label">${escapeHtml(field.label)}</label>
      <textarea data-field="${field.key}" placeholder="${escapeHtml(field.placeholder || "")}" rows="3">${escapeHtml(v || "")}</textarea>
      ${note}</div>`;
  }
  return `<div class="input-field">
    <label class="field-label">${escapeHtml(field.label)}</label>
    <input type="text" data-field="${field.key}" value="${escapeHtml(v || "")}" placeholder="${escapeHtml(field.placeholder || "")}" />
    ${note}</div>`;
}

function bindInputs() {
  document.querySelectorAll('[data-field]').forEach(el => {
    const handler = () => {
      const k = el.getAttribute('data-field');
      formData[k] = el.type === "checkbox" ? el.checked : el.value;
      persist();
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
  document.querySelectorAll('[data-multi]').forEach(el => {
    el.addEventListener('change', () => {
      const k = el.getAttribute('data-multi');
      const v = el.value;
      const cur = Array.isArray(formData[k]) ? [...formData[k]] : [];
      if (el.checked) {
        if (!cur.includes(v)) cur.push(v);
      } else {
        const i = cur.indexOf(v);
        if (i >= 0) cur.splice(i, 1);
      }
      formData[k] = cur;
      persist();
    });
  });
}

function renderStep() {
  headerArea.style.display = 'block';
  footerArea.style.display = 'flex';
  renderTopbarActions();

  const s = STEPS[currentStep];
  const isDone = completed[currentStep];
  const completedCount = completed.filter(Boolean).length;
  const pct = Math.round((completedCount / TOTAL) * 100);

  stepCounter.textContent = `${selectedState.name}  ·  Step ${currentStep + 1} of ${TOTAL}  ·  ${completedCount}/${TOTAL} done  ·  ${pct}%`;
  phaseLabel.textContent = s.phase;
  progressFill.style.width = `${pct}%`;

  backBtn.disabled = currentStep === 0;

  if (currentStep === TOTAL - 1 && isDone) {
    nextBtn.textContent = "Practice infrastructure complete ✓";
    nextBtn.disabled = true;
  } else if (currentStep === TOTAL - 1) {
    nextBtn.textContent = 'Mark complete & finish →';
    nextBtn.disabled = false;
  } else {
    nextBtn.textContent = isDone ? 'Continue to next step →' : 'Mark complete & continue →';
    nextBtn.disabled = false;
  }

  const stateBadgeHtml = s.stateBadge ? `<span class="badge badge-info">${escapeHtml(s.stateBadge)}</span>` : '';
  const skipBadgeHtml = s.canSkip ? `<span class="badge badge-success">May be skippable</span>` : '';
  const reviewBadgeHtml = s.isReview ? `<span class="badge badge-warning">Review & export</span>` : '';
  const finalBadgeHtml = s.isFinal ? `<span class="badge badge-success">Final infrastructure step</span>` : '';
  const doneBadge = isDone ? `<span class="badge badge-done">Done</span>` : '';

  const linksHtml = s.links && s.links.length ? `
    <div class="links">
      <p class="label-sm">Links & forms</p>
      <div class="links-list">
        ${s.links.map(l => `<a class="link-item" href="${l.url}" target="_blank" rel="noopener"><span class="link-arrow">→</span> ${escapeHtml(l.label)}</a>`).join('')}
      </div>
    </div>
  ` : '';

  const actionsHtml = `<ol class="actions">${s.actions.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ol>`;
  const sampleMsgHtml = s.showSampleMessage ? buildSampleMessageHtml() : '';

  const inputs = fieldInputs(s.key);
  const inputsHtml = inputs.length ? `
    <div class="input-section">
      <p class="label-sm">Provide the following information</p>
      ${inputs.map(renderInputField).join('')}
    </div>
  ` : '';

  const reviewHtml = s.isReview ? `
    <div class="review-section">
      <p class="label-sm">Your Practice Onboarding Form export — review before submitting</p>
      ${buildExportHtml()}
    </div>
  ` : '';

  const handoffHtml = s.isFinal ? `
    <div class="handoff">
      <p class="handoff-label">What's next</p>
      <p>After this step, your practice infrastructure is complete and your first family is on your calendar. The next phase — running the assessment, building the treatment plan, getting the authorization, and scheduling recurring appointments — is covered in a separate patient-care guide.</p>
    </div>
  ` : '';

  stepContainer.innerHTML = `
    <div class="card">
      <div class="step-head">
        <h1>${escapeHtml(s.title)}</h1>
        ${stateBadgeHtml}${skipBadgeHtml}${reviewBadgeHtml}${finalBadgeHtml}${doneBadge}
      </div>
      <p class="step-time">Estimated time · ${escapeHtml(s.time)}</p>

      <div class="why-block">
        <p class="label-sm">Why this matters</p>
        <p class="why-text">${escapeHtml(s.why)}</p>
      </div>

      <p class="label-sm">What to do</p>
      ${actionsHtml}
      ${sampleMsgHtml}
      ${linksHtml}
      ${inputsHtml}
      ${reviewHtml}
      ${handoffHtml}

      <div class="step-foot">
        <label class="done-toggle">
          <input type="checkbox" id="done-toggle" ${isDone ? 'checked' : ''} />
          <span>I've completed this step${s.canSkip ? " (or it doesn't apply to me)" : ""}</span>
        </label>
        <a class="support-link" href="mailto:${SUPPORT_EMAIL}?subject=Question%20about%20Provider%20Onboarding%20—%20${encodeURIComponent(s.title)}">Question about this step? ${SUPPORT_EMAIL}</a>
      </div>
    </div>

    <div class="step-dots">
      ${STEPS.map((st, i) => {
        const cls = completed[i] ? 'complete' : (i === currentStep ? 'current' : '');
        return `<button class="step-dot ${cls}" data-jump="${i}" title="${escapeHtml(st.title)}" aria-label="Jump to step ${i + 1}: ${escapeHtml(st.title)}"></button>`;
      }).join('')}
    </div>
  `;

  document.getElementById('done-toggle').addEventListener('change', (e) => {
    completed[currentStep] = e.target.checked;
    persist(); renderStep();
  });

  document.querySelectorAll('[data-jump]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentStep = parseInt(btn.getAttribute('data-jump'), 10);
      persist(); renderStep();
    });
  });

  bindInputs();
  if (s.isReview) bindExportButtons();
  if (s.showSampleMessage) bindSampleMessageButton();
}

backBtn.addEventListener('click', () => {
  if (currentStep > 0) { currentStep--; persist(); renderStep(); }
});

nextBtn.addEventListener('click', () => {
  completed[currentStep] = true;
  if (currentStep < TOTAL - 1) currentStep++;
  persist(); renderStep();
});

async function restartProgress() {
  if (!confirm('Reset all progress and form data? Your state selection will be kept.')) return;
  currentStep = 0;
  completed = new Array(TOTAL).fill(false);
  formData = { practiceName: "", ownerName: "", wantsReferrals: "", languages: "", ein: "", hasW9: false, hasCP575: false, bankRouting: "", bankAccount: "", bankName: "", businessEmail: "", agesServiced: [], clientPreferences: "", availability: "" };
  await persist();
  renderStep();
}

async function changeState() {
  if (!confirm('Change your state? Your progress will reset, but the form data you entered will be kept.')) return;
  selectedState = null;
  currentStep = 0;
  completed = [];
  await storage.delete('alpaca:state');
  await storage.delete('alpaca:currentStep');
  await storage.delete('alpaca:completed');
  stage = "stateSelect";
  renderStateSelect();
}

loadAll();
</script>
</body>
</html>
